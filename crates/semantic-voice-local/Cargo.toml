[package]
name = "semantic-voice-local"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local, pure-Rust text-to-speech (Kyutai Pocket TTS) and speech-to-text (Kyutai STT) on candle"
keywords = ["tts", "stt", "speech", "candle", "audio"]
categories = ["multimedia::audio", "science"]

[features]
default = ["hub"]
# Download models from the Hugging Face Hub.
hub = ["dep:hf-hub"]
# Hardware acceleration, passed through to candle.
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"], optional = true }
hound = "3.5"
rand = "0.9"
rand_distr = "0.5"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
